apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('release.properties')
if (releasePropertiesFile.exists()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}
def signingFields = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def hasReleaseSigning = signingFields.every { releaseProperties.getProperty(it) }

android {
    namespace 'com.bfjstudios.nottroll'
    compileSdk 36

    // The game has one source of truth at the repository root. Android only
    // packages a generated copy for its WebView at build time, so edits made
    // for web/PC are automatically included in the next APK.
    sourceSets {
        main {
            assets.srcDirs = [file("$buildDir/generated/webAssets")]
        }
    }

    defaultConfig {
        applicationId 'com.bfjgames.llc'
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 7
        versionName '1.0.6'
    }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseProperties.getProperty('storeFile'))
                storePassword releaseProperties.getProperty('storePassword')
                keyAlias releaseProperties.getProperty('keyAlias')
                keyPassword releaseProperties.getProperty('keyPassword')
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Otherwise Android Studio supplies signing via Generate Signed Bundle.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

def webAssetsDir = rootProject.file('..')
def generatedWebAssetsDir = file("$buildDir/generated/webAssets")

tasks.register('syncWebGameAssets', Sync) {
    from(webAssetsDir) {
        include 'index.html'
        include 'style.css'
        include 'game.min.js'
        include 'recursos/**'
    }
    into(generatedWebAssetsDir)
}

tasks.named('preBuild') {
    dependsOn(tasks.named('syncWebGameAssets'))
}

dependencies {
    // Google Play Billing Library directly — no RevenueCat layer for now
    // (see SubscriptionBridge.kt). A cross-platform entitlement backend via
    // RevenueCat may be reconnected later; see PLAY_RELEASE.md.
    implementation 'com.android.billingclient:billing:8.3.0'
    // Schedules the daily "come back and play" reminder notification.
    implementation 'androidx.work:work-runtime-ktx:2.10.1'
}
