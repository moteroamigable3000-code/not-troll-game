apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

def releaseProperties = new Properties()
def releasePropertiesFile = rootProject.file('release.properties')
if (releasePropertiesFile.exists()) {
    releasePropertiesFile.withInputStream { releaseProperties.load(it) }
}
def revenueCatKey = releaseProperties.getProperty('revenueCatAndroidApiKey', '')
def signingFields = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword']
def hasReleaseSigning = signingFields.every { releaseProperties.getProperty(it) }

android {
    namespace 'com.bfjstudios.nottroll'
    compileSdk 36

    defaultConfig {
        applicationId 'com.bfjgames.llc'
        minSdkVersion 23
        targetSdkVersion 36
        versionCode 1
        versionName '1.0'
        buildConfigField 'String', 'REVENUECAT_API_KEY', '"' + revenueCatKey.replace('\\', '\\\\').replace('"', '\\"') + '"'
    }

    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (hasReleaseSigning) {
                storeFile rootProject.file(releaseProperties.getProperty('storeFile'))
                storePassword releaseProperties.getProperty('storePassword')
                keyAlias releaseProperties.getProperty('keyAlias')
                keyPassword releaseProperties.getProperty('keyPassword')
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Otherwise Android Studio supplies signing via Generate Signed Bundle.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    // Wraps Google Play Billing (Android) behind RevenueCat's cross-platform
    // subscription API — see SubscriptionBridge.kt. The web build uses the
    // matching @revenuecat/purchases-js SDK (loaded in index.html) so both
    // platforms share one entitlement check keyed by our own player_id.
    implementation 'com.revenuecat.purchases:purchases:10.20.0'
}
