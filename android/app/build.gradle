apply plugin: 'com.android.application'

android {
    namespace 'com.bfjstudios.nottroll'
    compileSdk 36

    defaultConfig {
        applicationId 'com.bfjstudios.nottroll'
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
