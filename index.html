<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Not A Troll Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="wrap">
    <div id="splashScreen">
      <div id="splashLogoWrap">
        <img id="splashLogo" src="recursos/EMPRESA.png" alt="BFJ Studios">
        <div id="splashShine"></div>
      </div>
    </div>
    <div id="hud">
      <div id="levelLabel">Nivel 1</div>
      <div id="deathLabel">Muertes: 0</div>
      <button id="mapBtn" class="menuBtn">Mapa (Esc)</button>
      <button id="optionsBtn" class="menuBtn">Opciones</button>
      <button id="restartBtn">Reiniciar (R)</button>
    </div>
    <div id="progressTrack"><div id="progressFill"></div></div>
    <div id="canvasArea">
      <canvas id="game" width="960" height="540"></canvas>
      <div id="overlay">
        <div id="overlayTitle"></div>
        <div id="overlaySub"></div>
      </div>
      <div id="touchControls">
        <div class="pad">
          <button id="btnLeft" class="touchBtn" aria-label="Izquierda"></button>
          <button id="btnRight" class="touchBtn" aria-label="Derecha"></button>
        </div>
        <button id="btnJump" class="touchBtn" aria-label="Saltar"></button>
      </div>
    </div>

    <div id="mainMenu" class="screenOverlay">
      <div id="mainMenuTagline">Evil Devil</div>
      <h1>Not A Troll Game</h1>
      <button id="playBtn" class="menuBtn">Jugar</button>
      <button id="mapMenuBtn" class="menuBtn">Niveles</button>
      <button id="optionsMenuBtn" class="menuBtn">Opciones</button>
    </div>

    <div id="levelMap" class="screenOverlay" hidden>
      <h2>Selecciona un nivel</h2>
      <div id="mapCanvas">
        <div class="mapMountains mapMountainsFar"></div>
        <div class="mapMountains mapMountainsNear"></div>
        <svg id="mapPath" viewBox="0 0 100 100" preserveAspectRatio="none"></svg>
        <div id="levelGrid"></div>
      </div>
      <button class="menuBtn backBtn" data-close="levelMap">Volver</button>
    </div>

    <div id="optionsMenu" class="screenOverlay" hidden>
      <h2>Opciones</h2>
      <div class="optionRow">
        <span>Sonido</span>
        <button id="soundToggleBtn" class="menuBtn">Sonido: ON</button>
      </div>
      <div class="optionRow">
        <span>Musica</span>
        <button id="musicToggleBtn" class="menuBtn">Musica: ON</button>
      </div>
      <button id="menuFromOptionsBtn" class="menuBtn">Menu</button>
      <button class="menuBtn backBtn" data-close="optionsMenu">Volver</button>
    </div>
  </div>
  <script>
    window.API_BASE_URL = ['localhost', '127.0.0.1'].includes(location.hostname)
      ? 'http://127.0.0.1:8000'
      : '';
  </script>
  <script src="game.min.js"></script>
</body>
</html>
